name: G44-2 public game verification
on:
  push:
    branches: [verify-g44-2]
    paths: ['.github/workflows/verify-g44-2.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match public game bytes to the reviewed build
        run: |
          node dev/build.cjs && node dev/check-build.cjs
          for attempt in $(seq 1 24); do
            curl --max-time 12 -fsSL "https://1hyun-you.github.io/field/?verify=art4-${GITHUB_RUN_ID}-${attempt}" -o published.html && cmp -s index.html published.html && break
            sleep 5
          done
          cmp index.html published.html
          sha256sum index.html published.html
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture the published game at 320px and 390px
        env:
          GAME_URL: https://1hyun-you.github.io/field/?verify=0.46-art4
        run: node dev/check-rogue-art4.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: G44-2-public-320px-390px
          path: rogue-captures
