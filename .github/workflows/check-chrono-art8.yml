name: Validate chronomancer artwork
on:
  push:
    branches: ['art/g44-6-check']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check both build entry points
        run: |
          node dev/build.cjs
          cp index.html /tmp/chrono-build.html
          sh build.sh
          cmp index.html /tmp/chrono-build.html
          node dev/check-build.cjs
      - name: Verify 90 fusions
        run: |
          node dev/vfuse44.js --out chrono-fusions.json
          node -e "const r=require('./chrono-fusions.json');if(r.errs.length||r.res.fatal||r.res.fails.length||r.res.combos.length!==90)process.exit(1)"
      - name: Verify public deployment and capture both mobile widths
        if: ${{ !cancelled() }}
        env:
          GAME_URL: https://1hyun-you.github.io/field/?v=0.46-art8
        run: |
          for attempt in {1..24}; do
            LIVE="$GAME_URL&check=$GITHUB_RUN_ID-$attempt"
            if curl --fail --silent --show-error --max-time 10 "$LIVE" -o /tmp/chrono-public.html &&
              cmp -s /tmp/chrono-public.html index.html; then
              GAME_URL="$LIVE" node dev/check-chrono-art8.cjs
              exit
            fi
            sleep 10
          done
          echo 'The public game did not match the verified build' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrono-art8-verification
          path: |
            chrono-fusions.json
            chrono-captures/
