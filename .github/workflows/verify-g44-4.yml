name: G44-4 published game verification
on:
  push:
    branches: [verify-g44-4]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/build.cjs && node dev/check-build.cjs
      - name: Match public game bytes to the reviewed build
        run: |
          for attempt in $(seq 1 36); do
            curl --max-time 12 -fsSL "https://1hyun-you.github.io/field/?verify=art6-${GITHUB_RUN_ID}-${attempt}" -o published.html && cmp -s index.html published.html && break
            sleep 5
          done
          cmp index.html published.html
          sha256sum index.html published.html
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture archer scenarios in the public game
        env:
          GAME_URL: https://1hyun-you.github.io/field/?verify=0.46-art6
        run: node dev/check-archer-art6.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G44-4-published-320px-390px
          path: archer-captures/
