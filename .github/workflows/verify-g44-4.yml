name: G44-4 archer art verification
on:
  push:
    branches: [verify-g44-4]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/build.cjs && node dev/check-build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Test all 90 fusions
        run: |
          mkdir -p dev/sim_log
          node dev/vfuse44.js --out dev/sim_log/fuse-art6.json
          node -e "const {errs,res}=require('./dev/sim_log/fuse-art6.json');if(errs.length||res.fatal||res.fails.length||res.combos.length!==90)throw Error('Fusion regression');"
      - name: Capture eleven archer scenarios
        run: node dev/check-archer-art6.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G44-4-320px-390px
          path: |
            archer-captures/
            dev/sim_log/fuse-art6.json
