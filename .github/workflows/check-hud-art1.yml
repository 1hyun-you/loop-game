name: Verify 0.46 HUD art
on:
  push:
    branches: ['art/042-hud-046-art1']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium
      - run: |
          node dev/build.cjs
          for attempt in {1..10}; do
            if curl -fsSL "https://1hyun-you.github.io/field/?art1=$attempt" -o /tmp/field-live.html && cmp -s index.html /tmp/field-live.html; then
              break
            fi
            sleep 10
          done
          cmp index.html /tmp/field-live.html
          HUD_ART_URL='https://1hyun-you.github.io/field/?verify=0070ed3' node dev/check-hud-art1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-art1-live-320-390
          path: dev/hud-art1-captures/
